name: CI and Publish Extension

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect package changes and bump type
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      package_changed: ${{ steps.package_change.outputs.package_changed }}
      bump_type: ${{ steps.bump_type.outputs.bump_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package.json changes
        id: package_change
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "package.json"; then
            echo "package_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "package_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute bump type from commit messages
        id: bump_type
        run: |
          messages=$(jq -r '.commits[].message // empty' "$GITHUB_EVENT_PATH" | tr '[:lower:]' '[:upper:]')

          bump_type=none
          if echo "$messages" | grep -Eq '(^|[^A-Z])(FEAT|FT)([^A-Z]|$)'; then
            bump_type=major
          elif echo "$messages" | grep -Eq '(^|[^A-Z])(REF)([^A-Z]|$)'; then
            bump_type=minor
          elif echo "$messages" | grep -Eq '(^|[^A-Z])(FIX|ADD|DOC|PATCH)([^A-Z]|$)'; then
            bump_type=patch
          fi

          echo "bump_type=$bump_type" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build VSIX package (dry-run for PR safety)
        run: npx @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 7

  bump_version:
    name: Bump package version
    runs-on: ubuntu-latest
    needs:
      - validate
      - detect_changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && needs.detect_changes.outputs.bump_type != 'none'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version in package.json
        run: npm version "${{ needs.detect_changes.outputs.bump_type }}" --no-git-tag-version

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version (${{ needs.detect_changes.outputs.bump_type }})"
          git push

  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs:
      - validate
      - detect_changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect_changes.outputs.package_changed == 'true' && (github.actor == 'github-actions[bot]' || needs.detect_changes.outputs.bump_type == 'none')
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish -p "$VSCE_PAT"
